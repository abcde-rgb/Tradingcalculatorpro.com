        <!-- ══════════════════════════════════════════════════════════════
             Content-Security-Policy (hueco G-10)

             GitHub Pages no deja definir cabeceras, así que la política viaja
             en un `meta`. Eso impone dos límites que conviene saber:

               · `frame-ancestors` y `X-Frame-Options` NO funcionan en meta, así
                 que el anti-clickjacking NO se resuelve aquí. Sigue pendiente y
                 sólo se arregla con un CDN delante o saliendo de Pages.
               · El meta no admite `report-only`. No hay ensayo: una política mal
                 puesta rompe la web en producción y sin aviso. Por eso los
                 orígenes de abajo NO están adivinados — salen de medir con
                 Playwright lo que las once pantallas públicas piden de verdad,
                 más las integraciones que viven tras el muro y no se pueden
                 medir sin cuenta (TradingView, Google OAuth).

               · `connect-src` necesita el origen `wss://` APARTE del `https://`:
                 en CSP3 la relajación de esquemas va de `ws` a `http`/`https`,
                 NUNCA al revés, así que `https://api…` no autoriza
                 `wss://api…` y el WebSocket de alertas quedaba bloqueado. Lo
                 destapó `pre-despliegue.js` en el navegador; ningún test
                 offline podía verlo. `%REACT_APP_BACKEND_WS_URL%` lo deriva
                 `craco.config.js` del backend, para que no pueda divergir.

             `'unsafe-inline'` en `script-src` es obligado hoy: CRA y el arranque
             de GTM inyectan scripts en línea. No protege contra XSS reflejado,
             pero sí acota A QUÉ ORIGEN puede pedir código o datos la página, que
             es lo que corta la exfiltración a un dominio del atacante.
             ══════════════════════════════════════════════════════════════ -->
        <meta http-equiv="Content-Security-Policy" content="
            default-src 'self';
            script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://us-assets.i.posthog.com https://accounts.google.com https://s3.tradingview.com https://s.tradingview.com;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' data: https://fonts.gstatic.com;
            img-src 'self' data: blob: https:;
            connect-src 'self' %REACT_APP_BACKEND_URL% %REACT_APP_BACKEND_WS_URL% https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://us.i.posthog.com https://us-assets.i.posthog.com https://accounts.google.com;
            frame-src 'self' https://s.tradingview.com https://s3.tradingview.com https://www.tradingview.com https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com;
            worker-src 'self' blob:;
            object-src 'none';
            base-uri 'self';
            form-action 'self';
            upgrade-insecure-requests
        " />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <!-- ─────────── Iconos ───────────
             Esto es lo que el buscador pinta junto al resultado, y la portada
             declaraba MENOS iconos que las 2.410 páginas generadas: `ICONOS()`
             en `gen-seo-pages.js` ya ofrecía el de 192 px y aquí no estaba.
             Importa porque cuando hay varios, Yandex se queda con el mayor y
             Google pide un cuadrado múltiplo de 48 px — y los dos únicos rásters
             que ofrecía esta página eran 32 (dentro del `.ico`) y 180 (el de
             Apple, que no es múltiplo de 48). El `.ico` lleva ahora 16/32/48;
             el de 48 sale de promediar `icon-192.png` en cajas exactas de 4×4,
             no de estirar el de 32 (factor 1,5 = bordes sucios).

             Rutas por `%PUBLIC_URL%`, que el build resuelve a `/`: absolutas
             con el dominio dentro rompen la CSP en cuanto la página no se sirve
             desde ese dominio exacto (banco de pruebas, URL de proyecto de
             Pages, previsualizaciones). Ver el comentario de `ICONOS()`. -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />

            }

        <!--
          Aquí había diez `hreflang` apuntando a `?lang=xx` sobre ESTA MISMA URL.
          El SPA traduce en cliente, así que las diez variantes sirven un HTML
          idéntico; Google las canonicaliza a una sola y descarta las
          alternativas. Peor aún, el `canonical` de arriba apunta a la URL
          desnuda, o sea que el canonical y el hreflang se contradecían y ganaba
          el canonical: el resultado neto era gasto de rastreo y cero idiomas
          indexados de más.

          Las páginas ESTÁTICAS que genera `gen-seo-pages.js` sí lo hacen bien —
          `/en/options/strategies/...`, con canonical propio y el juego completo
          de alternativas— y ésas se quedan como están.

          Lo que falta para que la portada tenga hreflang de verdad es una home
          estática por idioma (`/en/index.html`, `/de/index.html`, …); hoy esos
          directorios sólo contienen subsecciones. Hasta entonces, declarar
          alternativas que no existen es peor que no declarar ninguna.
        -->
