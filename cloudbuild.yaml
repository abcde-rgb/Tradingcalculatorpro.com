# ============================================================
# TradingCalculator.pro — Google Cloud Build
# Alternativa a GitHub Actions para builds manuales desde GCP.
# Ejecutar desde la raíz del repositorio:
#   gcloud builds submit --config=cloudbuild.yaml .
# ============================================================
steps:
  # ── 1. Build imagen Docker ──────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - 'europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend:$COMMIT_SHA'
      - -t
      - 'europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend:latest'
      - -f
      - backend/Dockerfile
      - ./backend
    id: 'build'

  # ── 2. Push al Artifact Registry ───────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend:$COMMIT_SHA'
    id: 'push-sha'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend:latest'
    id: 'push-latest'
    waitFor: ['build']

  # ── 3. Deploy a Cloud Run ───────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tradingcalculator-api
      - --image=europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=10
      - --timeout=300
      - --concurrency=80
      - --set-env-vars=^;^GCP_PROJECT=tradingcalculator-495806;CORS_ORIGINS=https://abcde-rgb.github.io,https://tradingcalculatorpro.com;FRONTEND_URL=https://abcde-rgb.github.io/Tradingcalculatorpro.com;DEMO_EMAIL=demo@btccalc.pro;SENDER_EMAIL=alerts@tradingcalculatorpro.com
      - --update-secrets=JWT_SECRET=JWT_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,STRIPE_API_KEY=STRIPE_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
      - --add-cloudsql-instances=tradingcalculator-495806:europe-west1:trading-db
      - --service-account=trading-backend-sa@tradingcalculator-495806.iam.gserviceaccount.com
    waitFor: ['push-sha']
    id: 'deploy'

  # ── 4. Healthcheck ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        URL=$$(gcloud run services describe tradingcalculator-api \
          --region=europe-west1 \
          --format='value(status.url)')
        sleep 25
        curl -fsS "$$URL/api/health" && echo "✅ Healthcheck OK: $$URL" || echo "⚠️ Healthcheck falló"
    waitFor: ['deploy']

images:
  - 'europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend:$COMMIT_SHA'
  - 'europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
