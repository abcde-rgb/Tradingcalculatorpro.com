# ============================================================
# TradingCalculator.pro — Google Cloud Build (ruta MANUAL / avanzada)
# Recomendado: usar el workflow .github/workflows/deploy-cloud-run.yml.
# Este archivo es parametrizable por --substitutions. $PROJECT_ID es el proyecto
# donde corre el build (built-in de Cloud Build), así que NO hay project id fijo.
# Ejemplo:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_RUNTIME_SA=trading-backend-sa@$PROJECT_ID.iam.gserviceaccount.com .
# Guía de migración: docs/MIGRACION_GCP_NUEVA_CUENTA.md
# ============================================================
substitutions:
  _REGION: europe-west1
  _AR_REPO: trading-repo
  _SERVICE: tradingcalculator-api
  _MIN_INSTANCES: '0'          # 0 = escala a cero (lo más barato)
  _RUNTIME_SA: ''              # opcional; vacío → usa la SA por defecto de Cloud Run
  _CLOUDSQL: ''                # solo Cloud SQL: PROYECTO:REGION:INSTANCIA (con Neon, dejar vacío)

steps:
  # ── 1. Build imagen Docker ──────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$COMMIT_SHA'
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest'
      - -f
      - backend/Dockerfile
      - ./backend
    id: 'build'

  # ── 2. Push al Artifact Registry ───────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$COMMIT_SHA']
    id: 'push-sha'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest']
    id: 'push-latest'
    waitFor: ['build']

  # ── 3. Deploy a Cloud Run ───────────────────────────────────
  # Para Cloud SQL en vez de Neon, añade a los args:  --add-cloudsql-instances=${_CLOUDSQL}
  # Para fijar la service account, añade:              --service-account=${_RUNTIME_SA}
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=10
      - --timeout=300
      - --concurrency=80
      - --set-env-vars=^;^GCP_PROJECT=$PROJECT_ID;CORS_ORIGINS=https://abcde-rgb.github.io,https://tradingcalculatorpro.com;FRONTEND_URL=https://abcde-rgb.github.io/Tradingcalculatorpro.com;DEMO_EMAIL=demo@btccalc.pro;SENDER_EMAIL=alerts@tradingcalculatorpro.com
      - --update-secrets=JWT_SECRET=JWT_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,STRIPE_API_KEY=STRIPE_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
    waitFor: ['push-sha']
    id: 'deploy'

  # ── 4. Healthcheck ──────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        URL=$$(gcloud run services describe ${_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)')
        sleep 25
        curl -fsS "$$URL/api/health" && echo "✅ Healthcheck OK: $$URL" || echo "⚠️ Healthcheck falló"
    waitFor: ['deploy']
    id: 'healthcheck'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
