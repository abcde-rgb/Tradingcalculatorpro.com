# ============================================================
# TradingCalculator.pro — CI/CD: GitHub Actions → Google Cloud Run
# Proyecto GCP: tradingcalculator-495806
# Región: europe-west1 (Bélgica — más cercana a Zürich)
# ============================================================
name: Deploy Backend → Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

env:
  GCP_PROJECT: tradingcalculator-495806
  GCP_REGION: europe-west1
  SERVICE_NAME: tradingcalculator-backend
  IMAGE: europe-west1-docker.pkg.dev/tradingcalculator-495806/trading-repo/backend

jobs:
  # ── 1. Tests rápidos antes de desplegar ──────────────────
  test:
    name: ✅ Tests del Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Verificar dependencias críticas
        run: |
          python -c "import fastapi; print('✅ fastapi', fastapi.__version__)"
          python -c "import stripe; print('✅ stripe', stripe.VERSION)"
          python -c "import yfinance; print('✅ yfinance', yfinance.__version__)"
          python -c "import asyncpg; print('✅ asyncpg', asyncpg.__version__)"
          python -c "import slowapi; print('✅ slowapi ok')"
          python -c "import anthropic; print('✅ anthropic ok')"
          python -c "import jwt; print('✅ PyJWT', jwt.__version__)"
          python -c "import numpy, scipy, pandas; print('✅ numpy/scipy/pandas ok')"

      - name: Verificar sintaxis de todos los módulos Python
        run: |
          python -m py_compile server.py && echo "✅ server.py"
          python -m py_compile admin_routes.py && echo "✅ admin_routes.py"
          python -m py_compile options_math.py && echo "✅ options_math.py"
          python -m py_compile stock_data.py && echo "✅ stock_data.py"
          python -m py_compile candle_patterns.py && echo "✅ candle_patterns.py"
          python -m py_compile performance.py && echo "✅ performance.py"

      - name: Test de cálculos core (sin DB)
        run: |
          python -c "
          # Módulos de cálculo puramente matemáticos (no requieren DB ni red)
          from options_math import calculate_greeks, calculate_payoff, call_price, put_price

          # Black-Scholes sanity check: ATM call 1yr 20% IV debería estar ~8-11
          price = call_price(S=100, K=100, T=1.0, r=0.05, sigma=0.20)
          assert 8 < price < 12, f'BS call_price out of range: {price}'
          print('✅ Black-Scholes call_price =', round(price, 4))

          put = put_price(S=100, K=100, T=1.0, r=0.05, sigma=0.20)
          assert 3 < put < 7, f'BS put_price out of range: {put}'
          print('✅ Black-Scholes put_price =', round(put, 4))

          # Griegos agregados de una leg call comprada
          leg = {'type': 'call', 'action': 'buy', 'strike': 150, 'premium': 5, 'qty': 1, 'daysToExpiry': 30, 'iv': 0.25}
          greeks = calculate_greeks([leg], stock_price=150)
          assert 'delta' in greeks, 'Greeks missing delta'
          assert 0 < greeks['delta'] < 1, f'Delta out of range: {greeks[\"delta\"]}'
          print('✅ calculate_greeks delta =', greeks['delta'])

          # Payoff diagram
          payoff = calculate_payoff([leg], stock_price=150)
          assert isinstance(payoff, list) and len(payoff) > 0, 'Payoff should be non-empty list'
          print('✅ calculate_payoff points =', len(payoff))

          print('✅ All core math tests passed')
          "
        env:
          PYTHONPATH: "."

  # ── 2. Build & Deploy a Cloud Run ────────────────────────
  deploy:
    name: 🚀 Deploy a Cloud Run
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write  # Necesario para Workload Identity Federation

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Autenticación con GCP usando Workload Identity (sin claves JSON)
      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Configurar gcloud SDK
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # Configurar Docker para Artifact Registry
      - name: Configurar Docker Auth
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      # Build de la imagen Docker
      - name: Build imagen Docker
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            --file backend/Dockerfile \
            ./backend

      # Push al Artifact Registry de GCP
      - name: Push imagen a Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      # Deploy en Cloud Run
      - name: Deploy en Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --concurrency 80 \
            --set-env-vars="^;^GCP_PROJECT=${{ env.GCP_PROJECT }};CORS_ORIGINS=https://abcde-rgb.github.io,https://tradingcalculator.pro;FRONTEND_URL=https://abcde-rgb.github.io/Tradingcalculatorpro.com;DEMO_EMAIL=demo@btccalc.pro;SENDER_EMAIL=alerts@tradingcalculator.pro" \
            --update-secrets="JWT_SECRET=JWT_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,STRIPE_API_KEY=STRIPE_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest" \
            --add-cloudsql-instances=tradingcalculator-495806:europe-west1:trading-db \
            --service-account=trading-backend-sa@tradingcalculator-495806.iam.gserviceaccount.com

      # URL del servicio desplegado
      - name: Obtener URL del servicio
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          echo "✅ Backend desplegado en: $URL"
          echo "SERVICE_URL=$URL" >> $GITHUB_OUTPUT

      # Verificar que el servicio responde
      - name: Healthcheck post-deploy
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format 'value(status.url)')
          sleep 10
          curl -f "$URL/api/health" && echo "✅ Servicio respondiendo correctamente" || echo "⚠️ Healthcheck fallido"
