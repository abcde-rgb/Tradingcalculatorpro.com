name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_GA4_MEASUREMENT_ID: ${{ secrets.REACT_APP_GA4_MEASUREMENT_ID }}
          REACT_APP_GTM_ID: ${{ secrets.REACT_APP_GTM_ID }}
          REACT_APP_GSC_VERIFICATION: ${{ secrets.REACT_APP_GSC_VERIFICATION }}
          REACT_APP_BING_VERIFICATION: ${{ secrets.REACT_APP_BING_VERIFICATION }}
          # Google AdSense. Van como VARIABLES del repositorio, no secretos: el
          # ID de editor y los de bloque viajan en el HTML de cada página, no
          # hay nada que ocultar. Si no están definidas, el build sale SIN
          # publicidad (ni script, ni huecos, ni ads.txt) — es el estado por
          # defecto. Ver docs/MONETIZACION_ADS.md.
          # 'google' si el consentimiento lo gestiona la CMP certificada de
          # Google (AdSense → Privacidad y mensajes). Vacío = manda el banner
          # de cookies propio.
          # Con dominio propio el sitio cuelga de la RAÍZ. Mientras se servía en
          # `github.io/Tradingcalculatorpro.com` esto valía `/Tradingcalculatorpro.com`;
          # dejarlo así con el CNAME puesto rompe TODOS los assets.
          PUBLIC_URL: /
          # Origen único del que salen el sitemap y las ~1.630 páginas generadas
          # (`gen-sitemap.js` y `gen-seo-pages.js` lo leen). Si no coincide con el
          # canonical de cada página, Google descarta las URLs anunciadas.
          SITE_ORIGIN: https://tradingcalculator.pro
          CI: false
        run: npm run build

      # React Router SPA — direct URL loads return the app instead of 404
      - name: Copy index.html to 404.html
        run: cp frontend/build/index.html frontend/build/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build
          keep_files: false
          force_orphan: false
