name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo, no el commit suelto por defecto. `gen-seo-pages.js`
          # deriva el `lastmod` de cada página de `git log -1 -- <fichero fuente>`
          # — es lo que sustituye a la fecha del build, igual en las 1.685 URLs
          # cada vez, que es la razón por la que un buscador deja de fiarse del
          # campo entero. Con `fetch-depth: 1` (el valor por defecto) el clon
          # sólo trae el commit que disparó ESTE despliegue: si no tocó ese
          # fichero, `git log` no encuentra nada que mirar y el generador cae al
          # mismo build-date de siempre, en silencio. El fallo no se ve en
          # ningún test offline — hace falta el repositorio real para notarlo.
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          REACT_APP_GA4_MEASUREMENT_ID: ${{ secrets.REACT_APP_GA4_MEASUREMENT_ID }}
          REACT_APP_GTM_ID: ${{ secrets.REACT_APP_GTM_ID }}
          REACT_APP_GSC_VERIFICATION: ${{ secrets.REACT_APP_GSC_VERIFICATION }}
          REACT_APP_BING_VERIFICATION: ${{ secrets.REACT_APP_BING_VERIFICATION }}
          # Yandex Webmaster. El sitio publica 168 páginas en ruso y Yandex ya
          # las indexa; sin la propiedad verificada no se le puede enviar el
          # sitemap ni pedir que rastree el favicon. Si el secreto no está, el
          # meta sale vacío y no pasa nada.
          REACT_APP_YANDEX_VERIFICATION: ${{ secrets.REACT_APP_YANDEX_VERIFICATION }}
          # Google AdSense. Van como VARIABLES del repositorio, no secretos: el
          # ID de editor y los de bloque viajan en el HTML de cada página, no
          # hay nada que ocultar. Si no están definidas, el build sale SIN
          # publicidad (ni script, ni huecos, ni ads.txt) — es el estado por
          # defecto. Ver docs/MONETIZACION_ADS.md.
          # 'google' si el consentimiento lo gestiona la CMP certificada de
          # Google (AdSense → Privacidad y mensajes). Vacío = manda el banner
          # de cookies propio.
          # Con dominio propio el sitio cuelga de la RAÍZ. Mientras se servía en
          # `github.io/Tradingcalculatorpro.com` esto valía `/Tradingcalculatorpro.com`;
          # dejarlo así con el CNAME puesto rompe TODOS los assets.
          PUBLIC_URL: /
          # Origen único del que salen el sitemap y las ~2.410 páginas generadas
          # (lo lee `gen-seo-pages.js` — `gen-sitemap.js` está muerto, nada lo
          # ejecuta). Si no coincide con el canonical de cada página, Google
          # descarta las URLs anunciadas.
          SITE_ORIGIN: https://tradingcalculator.pro
          CI: false
        run: npm run build

      # ── La puerta que faltaba ────────────────────────────────────────
      #
      # `ci.yml` sólo se dispara con `pull_request`, y este workflow con `push` a
      # main: un push directo publicaba **sin que ningún verificador corriera**.
      # No es teórico — pasó el 2026-09-05 con el propio arreglo del SEO, que se
      # fusionó a main y desplegó sin CI.
      #
      # Aquí van las comprobaciones que guardan lo que el usuario recibe. Las de
      # higiene del repositorio (mapa, enlaces de doc, asistente) se quedan en
      # `ci.yml`: bloquear un despliegue de producción porque MAPA.md está
      # desfasado sería una puerta mal calibrada.
      #
      # Esto NO sustituye a proteger la rama en GitHub —un push que no toque
      # `frontend/**` ni dispara este workflow—, pero cierra el camino por el que
      # se publica de verdad.
      - name: Verificadores de lo publicado
        working-directory: frontend
        run: |
          set -e
          npx eslint src scripts   # 0 errores; los avisos de símbolos muertos NO bloquean (CLAUDE.md)
          node scripts/i18n-check.js
          node scripts/engine-check.js
          node scripts/check-seo.js
          python3 ../scripts/check-precios.py

      # React Router SPA — direct URL loads return the app instead of 404
      - name: Copy index.html to 404.html
        run: cp frontend/build/index.html frontend/build/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build
          keep_files: false
          force_orphan: false

      # Best-effort, DESPUÉS de publicar: si Bing/Yandex no responden, el sitio
      # ya se ha desplegado igual. Avisa sólo de las páginas con lastmod de
      # HOY (ver el propio script) — no reenvía las 2.475 en cada despliegue.
      - name: Avisar a Bing/Yandex de lo que cambió (IndexNow)
        working-directory: frontend
        continue-on-error: true
        run: node scripts/indexnow-ping.js
