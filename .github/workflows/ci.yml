# ============================================================
# CI de Pull Request — valida backend y frontend antes de merge.
# No despliega nada. El frontend se publica con deploy-gh-pages.yml (GitHub Pages).
# El despliegue del BACKEND lo gestiona el propietario en su propia infraestructura
# (no hay workflow de deploy de backend en el repo). Objetivo: frenar regresiones.
# ============================================================
name: CI (Pull Request)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 🐍 Backend — compile + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest

      - name: Verificar sintaxis (py_compile)
        run: |
          python -m py_compile \
            server.py admin_routes.py options_math.py options_optimize.py \
            stock_data.py candle_patterns.py performance.py missing_apis.py \
            realtime_alerts.py referrals.py
          echo "✅ Todos los módulos compilan"

      - name: Tests unitarios offline (las matemáticas siempre corren)
        run: pytest tests/ -q
        env:
          PYTHONPATH: "."
          # Sin BACKEND_URL: los tests de integración se saltan; los *_unit.py corren.

  frontend:
    name: ⚛️ Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Build de producción
        run: npm run build
        env:
          CI: false   # mismo criterio que el deploy: warnings no rompen el build
