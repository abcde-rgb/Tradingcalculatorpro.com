# ============================================================
# CI de Pull Request — valida backend y frontend antes de merge.
# No despliega nada. Al hacer push a `main` sí salen las dos mitades solas: el
# frontend por `deploy-gh-pages.yml`, y el backend por el despliegue desde
# código de Cloud Run (disparador en GCP, no en este repo — ver
# `.claude/rules/infra.md`). Objetivo de este workflow: frenar regresiones en PR.
# ============================================================
name: CI (Pull Request)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 🐍 Backend — compile + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgreSQL de verdad para las pruebas del shim `Collection` (G-17).
    #
    # Sin esto, `test_shim_collection_unit.py` se saltaría entero en CI y
    # tendríamos 42 pruebas que no corren en ningún sitio — que es exactamente
    # el tipo de verificador decorativo que este repositorio ya ha cazado tres
    # veces. Lo que prueban es la TRADUCCIÓN Mongo→SQL, así que un doble en
    # memoria daría verde sin traducir nada: o va contra Postgres o no vale.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: shim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # pytest-asyncio NO sobra: hay siete pruebas `async def` en
      # test_app_settings_roundtrip_unit.py. Sin el plugin, pytest no las salta
      # —las da por FALLIDAS— y encima avisa de que `@pytest.mark.asyncio` es un
      # marcador desconocido, que es fácil de leer como ruido. En local estaba
      # instalado de arrastre y en CI no, así que el fallo sólo salía aquí.
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      # La lista de módulos iba a mano y se quedó atrás: price_action, timeframes,
      # market_data, nowpayments, revolut y affiliate_program no se comprobaban.
      # Con el glob no hay nada que recordar actualizar al añadir un módulo.
      - name: Verificar sintaxis (py_compile)
        run: |
          python -m py_compile *.py
          echo "✅ Todos los módulos compilan"

      - name: Tests unitarios offline (las matemáticas siempre corren)
        run: pytest tests/ -q
        env:
          PYTHONPATH: "."
          # El shim se prueba contra el Postgres del servicio de arriba. Va por
          # TCP, así que lleva su propia variable: `DATABASE_URL` dispararía la
          # rama SSL de `init_pool` y las pruebas se saltarían en silencio.
          SHIM_TEST_DATABASE_URL: "postgresql://runner:runner@localhost:5432/shim_test"
          # Sin BACKEND_URL: los tests de integración se saltan; los *_unit.py corren.

  # ============================================================
  # La documentación tiene que reflejar el código, y hasta el 2026-08-13 nada lo
  # comprobaba: la doc llegó a decir 24 módulos con 28 en el repo, y PENDIENTES.md
  # acumuló enlaces a documentos que no existían. Estos tres pasos cuestan
  # segundos y hacen que la deriva rompa el PR en vez de descubrirse en una
  # auditoría un mes después.
  # ============================================================
  documentacion:
    name: 📚 Doc — mapa, enlaces y catálogo al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: El mapa del repositorio refleja el código
        run: python scripts/gen-mapa.py --check

      - name: Los enlaces de la documentación resuelven
        run: python scripts/check-doc-links.py

      - name: El catálogo de instrumentos está en paridad (backend ↔ frontend)
        run: python scripts/gen-instruments-js.py --check

      # El cableado del asistente no rompe ningún test cuando se pudre: sólo
      # hace que la IA se oriente con un mapa falso. El 2026-08-27 el mapa
      # listaba 7 de 17 skills, dos reglas disparaban sobre un fichero retirado
      # y los tres subagentes decían seguir una skill que no podían cargar.
      - name: El asistente está cableado (skills, comandos, agentes, reglas)
        run: python scripts/gen-asistente.py --check

      # El mapa CUENTA las rutas que ninguna pantalla llama; esto exige que cada
      # una lleve escrito qué se hace con ella. Sin ello, una ruta nueva e
      # inalcanzable sólo sube el contador y CI se queda verde.
      - name: Cada ruta sin consumidor tiene una decisión escrita
        run: python scripts/check-rutas-muertas.py

      # El importe de cada plan está en doce sitios y el que manda al cobrar
      # —SUBSCRIPTION_PLANS— es el único que la página NO consulta. Anunciar
      # un precio y cobrar otro no es un bug: es motivo de devolución.
      - name: El precio anunciado es el que se cobra
        run: python scripts/check-precios.py

      # Este SÍ bloquea. Comprueba que cada verificador falla cuando debe
      # fallar, saboteándolo y revirtiendo. Existe porque han aparecido varias
      # comprobaciones que no comprobaban nada —una guarda tautológica sobre el
      # orden del mapa, una regla que no disparaba nunca, un smoke visual que
      # imprimía ✅ produciendo imágenes en blanco—, y ninguna se habría cazado
      # ejecutándola y mirando si pasaba: pasaban.
      - name: ¿Los verificadores verifican? (sabotaje controlado)
        run: bash scripts/probar-verificadores.sh

      # Informativo, NO bloquea: `auditar.py` sale 0 salvo con --estricto. Un
      # informe que rompe el build se acaba desactivando, y entonces deja de
      # leerse. Aquí queda en el log del PR, que es donde se mira.
      - name: Auditoría del repositorio (informativa)
        run: python scripts/auditar.py --breve

  frontend:
    name: ⚛️ Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      # Dos comprobaciones estáticas que existían pero NO se ejecutaban en CI,
      # así que un fallo podía llegar a producción sin que nadie lo viera.
      - name: Paridad de los 10 idiomas
        run: node scripts/i18n-check.js

      - name: fetch() al backend con credentials
        run: node scripts/check-fetch-credentials.js

      # `i18n-check` comprueba paridad de CLAVES. Esto comprueba que además
      # estén TRADUCIDAS: llegó a haber 205 claves con el texto inglés literal
      # con `i18n-check` en verde, y se pintaban en pantalla.
      - name: Los diez idiomas están traducidos, no sólo presentes
        run: node scripts/i18n-traducido.js

      # Y escritos en su alfabeto. Los dos anteriores miran claves y valores;
      # ninguno mira los CARACTERES, y por ahí se colaron un «決» chino en una
      # frase italiana y un «별» coreano en una japonesa. En su primera
      # ejecución este verificador encontró dos más que ya estaban en
      # producción: una fila entera del chino escrita en ruso.
      - name: Cada idioma en su sistema de escritura
        run: node scripts/i18n-escritura.js

      # Los diagramas de la academia llevan 179 rótulos en castellano fijo.
      # Es deuda conocida y grande (~1.180 rótulos × 10 idiomas); esto no la
      # arregla, impide que crezca: el techo por fichero puede bajar, no subir,
      # y un diagrama nuevo parte de cero.
      - name: Los diagramas de la academia no ganan castellano nuevo
        run: node scripts/check-visuales-idioma.js

      # `t` con identidad estable congela todo `useMemo(..., [t])` en el idioma
      # del primer render (BUG-066). No lo ve ningún check de diccionarios: la
      # traducción es correcta, lo que falla es CUÁNDO se recalcula.
      - name: La identidad de `t` acompaña al idioma
        run: node scripts/check-i18n-identidad.js

      # Un logo dejado en `assets/partners/` sin regenerar el mapa no sale en la
      # web y nadie entiende por qué: el fichero está, la tarjeta no lo usa.
      - name: Los logos de socios reflejan los ficheros de la carpeta
        run: node scripts/gen-partner-logos.js --check

      # El simulador y el modelo del sistema de trading producen números con los
      # que el usuario dimensiona posiciones, y viven en el frontend, donde no
      # hay pytest que detecte una regresión.
      - name: Motores del frontend (simulador + sistema de trading)
        run: node scripts/engine-check.js

      # El índice de la Academia y su navegación son dos listas escritas a
      # mano. Si se separan, un módulo existe y no se encuentra nunca — o el
      # buscador manda a un ?topic= que la página no reconoce.
      - name: Índice de la Academia ↔ navegación
        run: node scripts/check-edu-index.js

      # La academia tenía cinco enlaces salientes en 5.500 líneas. Al conectarla
      # con las herramientas aparecieron veintitantos, y con ellos tres formas
      # de fallar en silencio: un `?tab=` que el panel no acepta te deja en la
      # pestaña por defecto, un id fuera de la tabla hace `return null`, y una
      # clave mal escrita se pinta cruda en el idioma que nadie mira.
      - name: Los enlaces de la Academia llevan a algún sitio
        run: node scripts/check-enlaces-academia.js

      # El quiz califica por la LETRA de la clave, no por posición. Lo que eso
      # no cubre —y esto sí— es que una traducción intercambie los valores
      # entre `a` y `b`: siete de las dieciocho preguntas tienen opciones que
      # son opuestos exactos, y ahí un intercambio hace que el quiz enseñe lo
      # contrario devolviendo un ✅.
      - name: El quiz califica lo que dice calificar (10 idiomas)
        run: node scripts/check-quiz.js

      # `engine-check` comprueba casos ELEGIDOS y sólo encuentra lo que a
      # alguien se le ocurrió mirar. Esto son 1000 escenarios GENERADOS, todos
      # distintos, con ~20.000 invariantes sobre el significado de cada cifra.
      # Encontró el saldo negativo del simulador y el Infinity del factor de
      # beneficio, dos cosas que 264 comprobaciones a mano no vieron.
      - name: Simulación masiva (1000 escenarios)
        run: node scripts/simulacion-masiva.js

      # ESLint existía en el repo pero su configuración no parseaba NI UN
      # fichero (0 de 283): el parser de Babel abortaba en todos. Con el linter
      # mudo llegó a producción, entre otras cosas, un `idx` no definido que
      # reventaba la calculadora de Fibonacci. Falla sólo ante errores
      # (no-undef, rules-of-hooks); los avisos de limpieza no bloquean el PR.
      - name: Lint (ESLint)
        run: npx eslint src scripts

      - name: Build de producción
        run: npm run build
        env:
          CI: false   # mismo criterio que el deploy: warnings no rompen el build

      # El `postbuild` genera 1.630 páginas indexables y un sitemap de 1.639
      # URLs — el mayor activo de captación del proyecto — y hasta el
      # 2026-08-27 no lo comprobaba nada. Los fallos de SEO son silenciosos por
      # naturaleza: un canonical cruzado o un hreflang incompleto no rompen
      # ninguna pantalla, sólo hacen que Google deje de indexar. Va DESPUÉS del
      # build porque mira las páginas generadas, no el código que las genera.
      - name: Las páginas prerenderizadas son indexables
        run: node scripts/check-seo.js

      # El presupuesto de peso existía, funcionaba y no corría en ningún sitio,
      # así que sólo lo veía quien se acordaba de lanzarlo a mano. Nadie se
      # acordó: `/brokers` se pasó de su presupuesto y el repo no se enteró.
      # Un presupuesto que no se comprueba no es un presupuesto.
      #
      # La holgura es en KB ABSOLUTOS, no en porcentaje: con un 8 % sobre una
      # pantalla de 1 MB caben 80 KB de librería nueva sin que salte nada.
      # Las dos sondas de abajo abren un navegador de verdad, y `entorno.js` lo
      # busca bajo `PLAYWRIGHT_BROWSERS_PATH` o `/opt/pw-browsers`. Esa ruta
      # existe en el sandbox donde se escribieron —viene con Chromium
      # preinstalado— y NO en el runner de GitHub, así que las dos morían con
      # «No encuentro Chromium bajo /opt/pw-browsers» ANTES de medir nada: el
      # presupuesto de peso y la CSP llevaban rojos en todos los PR, y el rojo
      # no decía nada del código que se estaba revisando.
      #
      # El `npm install playwright-core` que hacen esos pasos no lo arregla:
      # `playwright-core` es justamente el paquete que NO descarga navegadores.
      # Y `playwright install` tampoco es la salida — descarga ~150 MB en cada
      # tanda para usar un navegador que el runner ya trae.
      #
      # `entorno.js` ya tenía prevista la salida (`QA_CHROMIUM`); lo que faltaba
      # era rellenarla. Va por `$GITHUB_ENV` y no con un `export` dentro de cada
      # `run:` porque cada paso es un shell distinto: exportarlo en el de peso no
      # llegaría al de la CSP.
      #
      # ⚠️ PORTADO DEL PR #224, que arregla esto y sigue sin fusionar. No es un
      # cambio de este PR: se trae para que su job de frontend deje de morir por
      # un motivo ajeno al diff. Cuando #224 entre en main, este bloque queda
      # idéntico al que ya estará ahí y no hace nada.
      - name: Localizar el Chromium del runner
        working-directory: .
        run: |
          ruta="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          # Sin la guarda, un runner sin Chrome dejaría `QA_CHROMIUM` VACÍO, que
          # `entorno.js` trata como «no configurado» y vuelve al mismo error con
          # otra cara. Que falle aquí y diga por qué.
          if [ -z "$ruta" ]; then
            echo "::error::No hay Chromium en el runner. Las sondas de navegador (peso, CSP) lo necesitan."
            exit 1
          fi
          echo "QA_CHROMIUM=$ruta" >> "$GITHUB_ENV"
          echo "Chromium del runner: $ruta"

      - name: Presupuesto de peso por pantalla
        working-directory: .
        run: |
          mkdir -p tests/e2e/lib
          (cd tests/e2e && npm install --silent --no-save --prefix . playwright-core)
          ln -sfn "$PWD/tests/e2e/node_modules/playwright-core" "$PWD/tests/e2e/lib/playwright-core"
          node tests/e2e/stack/servidor.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3100 >/dev/null && break || sleep 1
          done
          node tests/e2e/navegador/peso.js

      # La CSP viaja en un `meta` porque Pages no admite cabeceras, y el meta NO
      # admite report-only: no hay ensayo. Una directiva de menos bloquea
      # TradingView o el botón de Google EN PRODUCCIÓN, y ningún test offline lo
      # nota porque ninguno abre un navegador.
      - name: La CSP no rompe la web
        working-directory: .
        run: node tests/e2e/navegador/csp.js
