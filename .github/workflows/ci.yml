# ============================================================
# CI de Pull Request — valida backend y frontend antes de merge.
# No despliega nada (eso lo hacen deploy-gh-pages.yml y deploy-cloud-run.yml
# al hacer push a main). Objetivo: frenar regresiones en PR.
# ============================================================
name: CI (Pull Request)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: 🐍 Backend — compile + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest

      # La lista de módulos iba a mano y se quedó atrás: price_action, timeframes,
      # market_data, nowpayments, revolut y affiliate_program no se comprobaban.
      # Con el glob no hay nada que recordar actualizar al añadir un módulo.
      - name: Verificar sintaxis (py_compile)
        run: |
          python -m py_compile *.py
          echo "✅ Todos los módulos compilan"

      - name: Tests unitarios offline (las matemáticas siempre corren)
        run: pytest tests/ -q
        env:
          PYTHONPATH: "."
          # Sin BACKEND_URL: los tests de integración se saltan; los *_unit.py corren.

  frontend:
    name: ⚛️ Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      # Dos comprobaciones estáticas que existían pero NO se ejecutaban en CI,
      # así que un fallo podía llegar a producción sin que nadie lo viera.
      - name: Paridad de los 8 idiomas
        run: node scripts/i18n-check.js

      - name: fetch() al backend con credentials
        run: node scripts/check-fetch-credentials.js

      # El simulador y el modelo del sistema de trading producen números con los
      # que el usuario dimensiona posiciones, y viven en el frontend, donde no
      # hay pytest que detecte una regresión.
      - name: Motores del frontend (simulador + sistema de trading)
        run: node scripts/engine-check.js

      # "Con Premium no hay anuncios" es una promesa comercial: se comprueba,
      # no se confía. Fija también que ninguna página de pago monte un AdSlot.
      - name: Política de publicidad (Premium sin anuncios)
        run: node scripts/ads-check.js

      # ESLint existía en el repo pero su configuración no parseaba NI UN
      # fichero (0 de 283): el parser de Babel abortaba en todos. Con el linter
      # mudo llegó a producción, entre otras cosas, un `idx` no definido que
      # reventaba la calculadora de Fibonacci. Falla sólo ante errores
      # (no-undef, rules-of-hooks); los avisos de limpieza no bloquean el PR.
      - name: Lint (ESLint)
        run: npx eslint src scripts

      # Un acento bonito con texto ilegible no lo ve nadie a ojo, y menos quien
      # eligió la paleta. En una web financiera un dato que no se lee es un
      # número que alguien leerá mal.
      - name: Contraste de los temas (WCAG AA)
        run: node scripts/theme-contrast-check.js

      - name: Build de producción
        run: npm run build
        env:
          CI: false   # mismo criterio que el deploy: warnings no rompen el build
