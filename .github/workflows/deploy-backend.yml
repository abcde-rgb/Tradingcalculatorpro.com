name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        working-directory: backend
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/tradingcalculator-api \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tradingcalculator-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/tradingcalculator-api \
            --platform managed \
            --region europe-west1 \
            --allow-unauthenticated \
            --port 8080 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --add-cloudsql-instances ${{ secrets.GCP_PROJECT_ID }}:europe-west1:${{ secrets.CLOUDSQL_INSTANCE_NAME }} \
            --set-env-vars "DATABASE_URL=postgresql://${{ secrets.CLOUDSQL_USER }}:${{ secrets.CLOUDSQL_PASSWORD }}@/${{ secrets.CLOUDSQL_DBNAME }}?host=/cloudsql/${{ secrets.GCP_PROJECT_ID }}:europe-west1:${{ secrets.CLOUDSQL_INSTANCE_NAME }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}" \
            --set-env-vars "STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}" \
            --set-env-vars "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" \
            --set-env-vars "SENDER_EMAIL=alerts@tradingcalculator.pro" \
            --set-env-vars "FRONTEND_URL=https://abcde-rgb.github.io/Tradingcalculatorpro.com" \
            --set-env-vars "CORS_ORIGINS=https://abcde-rgb.github.io"
