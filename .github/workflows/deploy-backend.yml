name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: tradingcalculator-api
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tradingcalculator/tradingcalculator-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Create Artifact Registry repository (if not exists)
        run: |
          gcloud artifacts repositories create tradingcalculator \
            --repository-format=docker \
            --location=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --quiet || true

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --add-cloudsql-instances ${{ secrets.GCP_PROJECT_ID }}:us-central1:${{ secrets.CLOUDSQL_INSTANCE_NAME }} \
            --set-env-vars "DATABASE_URL=postgresql://${{ secrets.CLOUDSQL_USER }}:${{ secrets.CLOUDSQL_PASSWORD }}@/${{ secrets.CLOUDSQL_DBNAME }}?host=/cloudsql/${{ secrets.GCP_PROJECT_ID }}:us-central1:${{ secrets.CLOUDSQL_INSTANCE_NAME }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}" \
            --set-env-vars "STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}" \
            --set-env-vars "SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}" \
            --set-env-vars "SENDER_EMAIL=alerts@tradingcalculator.pro" \
            --set-env-vars "FRONTEND_URL=https://abcde-rgb.github.io/Tradingcalculatorpro.com" \
            --set-env-vars "CORS_ORIGINS=https://abcde-rgb.github.io"

      - name: Show deployed URL
        run: |
          echo "✅ Backend desplegado en:"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format "value(status.url)"
