<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión — TradingCalculator.Pro</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #09090b; color: #fafafa; padding: 24px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card { max-width: 420px; text-align: center; }
  .dot {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%;
    background: rgba(34,197,94,.12); display: grid; place-items: center;
  }
  svg { width: 28px; height: 28px; stroke: #22c55e; fill: none; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #a1a1aa; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
  button {
    background: #22c55e; color: #052e16; border: 0; border-radius: 10px;
    padding: 11px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #16a34a; }
  .note { margin-top: 20px; font-size: 12px; color: #71717a; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">
      <svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.7 5.1a10 10 0 019.2 3M5 12.5a10 10 0 013-2.3M8.5 16.4a5 5 0 015.4-.9M12 20h.01"/></svg>
    </div>
    <h1>Sin conexión</h1>
    <p>
      No hay red ahora mismo. Los precios y las calculadoras necesitan conexión para
      darte datos reales — preferimos no enseñarte nada antes que enseñarte un precio viejo.
    </p>
    <button onclick="location.reload()">Reintentar</button>
    <div class="note">TradingCalculator.Pro</div>
  </div>
</body>
</html>
